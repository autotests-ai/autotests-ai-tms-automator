# DEPRECATED: use selenoid-qa-guru_github_e2e.properties (-Denv=selenoid-qa-guru_github_e2e).
# CI profile: Selenoid cloud + Allure TestOps upload (GitHub Actions selenoid-qa-guru_github.yml, name: qa_guru_automator_ethalon-5267 Tests).
# Diagnostic run (Run 3): full attachments. Fast path: fast-testops.properties (ADR 004).

# Allure report
allureReportMode=allure3

# Allow attachments after each test
attachBrowserConsoleLogs=false
attachHarLogs=false
attachLastScreenshot=true
attachPageSource=true
attachVideo=true
# Allow allure steps listener
enableAllureSelenideListener=true

# Target app
baseUrl=https://qa-guru.github.io/one-page-form/
basePath=

# Browser configuration
browser=chrome
browserSize=1920x1280
headless=true
closeBrowserAfterEach=false

# Remote browser hub configuration
enableHar=false
enableVnc=false
enableVideo=true
videoFolder=https://selenoid.qa.guru/video/
remoteUrl=https://user1:1234@selenoid.qa.guru/wd/hub

# Console log
logToConsole=false
selenideLogToConsole=false
rootLogLevel=warn

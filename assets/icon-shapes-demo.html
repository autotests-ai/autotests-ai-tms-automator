<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Иконки — варианты формы</title>
  <style>
    :root {
      --bg: #1a1d23;
      --surface: #242830;
      --surface-2: #2d323c;
      --text: #e8eaed;
      --muted: #9aa0a8;
      --border: rgba(255,255,255,0.08);
      --accent: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 20px 60px;
      line-height: 1.45;
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    .lead { color: var(--muted); max-width: 680px; margin: 0 0 28px; font-size: 0.92rem; }
    .lead a { color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: rgba(129,140,248,.35); }
    .card.selected {
      border-color: rgba(129,140,248,.6);
      box-shadow: 0 0 0 1px rgba(129,140,248,.2);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .sizes { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .icon-16 { width: 16px; height: 16px; border-radius: 3px; image-rendering: pixelated; }
    .icon-32 { width: 32px; height: 32px; border-radius: 6px; }

    .card-info { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .card-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .card-file { font-family: ui-monospace, monospace; font-size: 0.72rem; color: #64748b; }

    /* chip + menu preview inside card */
    .preview-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .plate {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(79,70,229,.22);
      color: #c7d2fe;
      border: 1px solid rgba(129,140,248,.35);
    }
    .chip img { width: 16px; height: 16px; border-radius: 3px; }

    .menu {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 0;
      font-size: 13px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
    }
    .menu-item.on { background: rgba(255,255,255,.06); }
    .menu-item img { width: 16px; height: 16px; border-radius: 3px; }
    .menu-item .sp { width: 14px; flex-shrink: 0; }

    .pick-bar {
      position: sticky;
      bottom: 0;
      margin-top: 24px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid rgba(129,140,248,.35);
      border-radius: 12px;
      display: none;
      align-items: center;
      gap: 14px;
    }
    .pick-bar.visible { display: flex; }
    .pick-bar img { width: 32px; height: 32px; border-radius: 6px; }
    .pick-bar code { font-size: 0.82rem; color: #a5b4fc; }
  </style>
</head>
<body>
  <h1>14 форм для иконки «Автоматизировать»</h1>
  <p class="lead">
    Все на индиго #4338CA, оптимизированы под <strong>16 px</strong> в TestOps.
    Кликни на карточку — внизу появится путь к PNG для загрузки.
    <a href="status-demo.html">← назад к сравнению цветов</a>
  </p>

  <div class="grid" id="grid"></div>

  <div class="pick-bar" id="pick">
    <img id="pick-img" src="" alt="">
    <div>
      <div>Выбрано: <strong id="pick-title"></strong></div>
      <code id="pick-path"></code>
    </div>
  </div>

  <script>
    const SHAPES = [
      { id: 'bot',       title: 'Робот',      desc: 'ИИ, но без «магии» — узнаваемо' },
      { id: 'terminal',  title: '>_',         desc: 'Терминал / dev-tool — доверие инженеров' },
      { id: 'checklist', title: 'Чеклист',    desc: 'Ручной кейс → автотест' },
      { id: 'branch',    title: 'Git-ветка',  desc: 'CI / pipeline / репозиторий' },
      { id: 'inbox',     title: 'Импорт ↓',   desc: 'Сгенерировать и положить в repo' },
      { id: 'pen',       title: 'Перо',       desc: 'Написать код теста' },
      { id: 'flask',     title: 'Колба',      desc: 'QA / лаборатория' },
      { id: 'bolt',      title: 'Молния',     desc: 'Быстрое действие' },
      { id: 'refresh',   title: 'Цикл ↻',     desc: 'Автоматизация / перезапуск' },
      { id: 'chip',      title: 'Чип',        desc: 'Engine / вычисление' },
      { id: 'layers',    title: 'Слои',       desc: 'Стек / pipeline шагов' },
      { id: 'chevron',   title: '>>',         desc: 'Вперёд / run' },
      { id: 'letter-a',  title: 'A',          desc: 'Automate — минимализм' },
      { id: 'hammer',    title: 'Молоток',    desc: 'Build / сборка' },
    ];

    const grid = document.getElementById('grid');
    const pick = document.getElementById('pick');

    SHAPES.forEach(s => {
      const file = `icons/shape-${s.id}-64.png`;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <div class="sizes">
            <img class="icon-16" src="icons/shape-${s.id}-64.png" alt="">
            <img class="icon-32" src="icons/shape-${s.id}-64.png" alt="">
          </div>
          <div class="card-info">
            <div class="card-title">${s.title}</div>
            <div class="card-desc">${s.desc}</div>
            <div class="card-file">shape-${s.id}-64.png</div>
          </div>
        </div>
        <div class="plate">
          <div>
            <div class="preview-label">Чип</div>
            <span class="chip"><img src="icons/shape-${s.id}-64.png" alt="">Автоматизировать</span>
          </div>
          <div>
            <div class="preview-label">Меню</div>
            <div class="menu">
              <div class="menu-item"><span class="sp"></span>Автоматизировано с ИИ</div>
              <div class="menu-item on"><span class="sp">✓</span><img src="icons/shape-${s.id}-64.png" alt="">Автоматизировать</div>
            </div>
          </div>
        </div>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        document.getElementById('pick-img').src = file;
        document.getElementById('pick-title').textContent = s.title;
        document.getElementById('pick-path').textContent = 'assets/' + file;
        pick.classList.add('visible');
      });
      grid.appendChild(card);
    });
  </script>
</body>
</html>
